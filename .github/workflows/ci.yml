name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # This also fails when package.json and package-lock.json disagree, which
      # is what the check:package-lock script used to be for.
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint:check
      - name: Test
        run: npm test
      - name: Build the bundles
        run: npm run build
